appId: com.deepclause.pibox
productName: pi-box
directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!docs/*'
  - '!build/*'
  - '!dist/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

# agentvm loads its wasm and worker script with real file APIs inside a worker
# thread, so disable asar entirely — keep node_modules as real files on disk.
asar: false

npmRebuild: false

# The wllama engine wasm is served to the renderer over the pibox-asset
# protocol. Keep a real copy next to the packaged app.
extraResources:
  - from: node_modules/@wllama/wllama/esm/wasm/wllama.wasm
    to: wllama.wasm

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dmg
    - zip

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable

linux:
  icon: build/icon.png
  category: Development
  maintainer: andreas@deepclause.ai
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
